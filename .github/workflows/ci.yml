name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | (! grep .)

  # Runs the unit + acceptance test suite against both ecosystems this
  # provider targets (see README's "Dual registry" plan) — Terraform
  # needs no special environment variables; OpenTofu needs
  # TF_ACC_PROVIDER_HOST set because it enforces a stricter registry-host
  # check on the test harness's locally-reattached provider than
  # Terraform does (see README's "Development" section for the full
  # explanation).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        binary: [terraform, tofu]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      # uses: can't take an expression, so the two setup actions are
      # separate steps gated by matrix.binary instead of one dynamic step.
      - if: matrix.binary == 'terraform'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - if: matrix.binary == 'tofu'
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          terraform_wrapper: false
      - name: go test
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v ${{ matrix.binary }})"
          if [ "${{ matrix.binary }}" = "tofu" ]; then
            export TF_ACC_PROVIDER_HOST=registry.opentofu.org
          fi
          go test ./... -v
